name: refresh-vidara
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run refresh_vidara.py
        env:
          VIDARA_SITE: ${{ secrets.VIDARA_SITE }}
          VIDARA_API_KEY: ${{ secrets.VIDARA_API_KEY }}
        run: python scripts/refresh_vidara.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/vidara.json
          git diff --cached --quiet || (git commit -m "auto: refresh index Vidara" && git pull --rebase origin main && git push)
