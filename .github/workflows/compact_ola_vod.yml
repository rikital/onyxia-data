name: compact-ola-vod

# 2026-09-27 : (re)fabrique data/olatv/ola-vod-fr-compact.json a partir de l'index actuel,
#   sans relancer le long scan des portails. Se lance quand le script ou ce fichier change,
#   ou a la main. Le robot refresh-ola-vod le refait ensuite a chaque passage.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/olatv/compacter_ola_vod.py'
      - '.github/workflows/compact_ola_vod.yml'

concurrency:
  group: refresh-ola-vod-only
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compacter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compacter
        run: python scripts/olatv/compacter_ola_vod.py
      - name: Pousser si modifie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/olatv/ola-vod-fr-compact.json
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "chore(olatv): version compacte de ola-vod-fr.json"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 6; done
          exit 1