name: Contrôle des fichiers de la base

# Fichiers de la base ONYX hébergés sur une adresse IP brute : le Worker Cloudflare ne peut pas
# les appeler, GitHub Actions le fait une fois par jour (cf. scripts/controle_fichiers.py).
# Aucun secret : le Worker vérifie le jeton OIDC de ce dépôt.
on:
  schedule:
    - cron: '41 3 * * *'   # chaque jour à 03:41 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les fichiers
        run: python scripts/controle_fichiers.py
