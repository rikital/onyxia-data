name: playlist-xvideos

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: donnees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  xvideos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer la playlist
        run: |
          set -e
          SCRIPT="$(find . -name xvideos_m3u.py -not -path './.git/*' | head -n 1)"
          echo "script : $SCRIPT"
          python -u "$SCRIPT"

      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CIBLE="$(find . -name xvideos.m3u -not -path './.git/*' | head -n 1)"
          if [ -z "$CIBLE" ]; then
            echo "xvideos.m3u absent, rien a publier"
            exit 0
          fi
          echo "fichier : $CIBLE"

          for tentative in 1 2 3 4 5; do
            echo "--- tentative $tentative ---"
            cp "$CIBLE" /tmp/xvideos.m3u
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/xvideos.m3u "$CIBLE"
            git add "$CIBLE"
            if git diff --cached --quiet; then
              echo "deja a jour"
              exit 0
            fi
            git commit -q -m "xvideos: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push -q origin main; then
              echo "pousse"
              exit 0
            fi
            sleep 4
          done
          echo "echec apres 5 tentatives"
          exit 1
