name: playlist-adulte

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: donnees
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  adulte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer la playlist
        run: |
          set -e
          SCRIPT="$(find . -name eporner_m3u.py -not -path './.git/*' | head -n 1)"
          if [ -z "$SCRIPT" ]; then
            echo "script eporner_m3u.py introuvable"
            exit 1
          fi
          echo "script : $SCRIPT"
          echo "lignes : $(wc -l < "$SCRIPT")"
          echo "--- dernieres lignes du script ---"
          tail -n 3 "$SCRIPT"
          echo "--- controle de syntaxe ---"
          python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read()); print('syntaxe OK')" "$SCRIPT"
          echo "--- execution ---"
          python -u "$SCRIPT"

      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CIBLE="$(find . -name adult.m3u -not -path './.git/*' | head -n 1)"
          if [ -z "$CIBLE" ]; then
            echo "adult.m3u absent, rien a publier"
            exit 0
          fi
          echo "fichier : $CIBLE"

          for tentative in 1 2 3 4 5; do
            echo "--- tentative $tentative ---"
            cp "$CIBLE" /tmp/adulte.m3u
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/adulte.m3u "$CIBLE"
            git add "$CIBLE"
            if git diff --cached --quiet; then
              echo "deja a jour"
              exit 0
            fi
            git commit -q -m "adulte: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push -q origin main; then
              echo "pousse"
              exit 0
            fi
            sleep 4
          done
          echo "echec apres 5 tentatives"
          exit 1

      # autosuppression des vieux runs (comme les autres workflows)
      - name: Auto-cleanup old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 10
