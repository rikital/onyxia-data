name: playlist-adulte

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: donnees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  adulte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer la playlist
        run: |
          set -e
          SCRIPT="$(find . -name eporner_m3u.py -not -path './.git/*' | head -n 1)"
          python "$SCRIPT"

      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/adult.m3u ]; then
            echo "adult.m3u absent, rien a publier"
            exit 0
          fi
          git add data/adult.m3u
          if git diff --cached --quiet; then
            echo "aucun changement"
            exit 0
          fi
          git commit -m "adulte: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase --autostash
            sleep 5
          done
