name: debug-sources

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnostic des deux sites
        run: |
          SCRIPT="$(find . -name debug_sources.py -not -path './.git/*' | head -n 1)"
          echo "script : $SCRIPT"
          python -u "$SCRIPT"
